name: Release

# 打一个 v* 的 tag（如 v1.0.18）就会触发全平台构建并发布 Release。
# 也可以在 GitHub 网页手动触发（Actions -> Release -> Run workflow），
# 手动触发时必须填要发布的 tag——否则构建出的产物会挂到分支名下。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v1.0.18）"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：一台机器出 Intel + Apple Silicon 通用包
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          # Linux：.deb / .AppImage / .rpm
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          # Windows：.msi / .exe(NSIS)
          - platform: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          # 手动触发时 checkout 的是分支，要显式切到指定 tag，
          # 否则打包出来的是分支最新代码而不是这个 tag 的代码。
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: npm ci

      - name: Build & release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "ChatFinder ${{ inputs.tag || github.ref_name }}"
          releaseBody: |
            下载下面对应平台的安装包。

            **macOS 首次打开**：这里的构建产物没有经过 Apple 公证，从浏览器下载后会被 Gatekeeper 拦下，提示「无法打开，因为无法验证开发者」，或者干脆说「已损坏，应移到废纸篓」——后者只是提示措辞，文件本身没有损坏。把应用拖进「应用程序」后，在终端执行一次：

            ```
            xattr -cr /Applications/ChatFinder.app
            ```

            或者双击一次让它被拦下，然后到「系统设置 → 隐私与安全性」页面底部点「仍要打开」。两种方法都只需要做一次。

            Windows 和 Linux 的产物不受此影响。

            ---

            Download the installer for your platform below.

            **First launch on macOS**: these builds are not notarized by Apple, so Gatekeeper blocks them after a browser download — "cannot be opened because the developer cannot be verified", or sometimes "is damaged and can't be opened", which is just the wording, the file is fine. Drag the app into Applications, then run this once:

            ```
            xattr -cr /Applications/ChatFinder.app
            ```

            Or let the first launch be blocked, then open System Settings → Privacy & Security and click "Open Anyway" at the bottom. Either way it is a one-time step.

            Windows and Linux builds are unaffected.
          # 草稿版本不会出现在仓库首页的 Releases 里，也不能被下载——
          # 直接发布，让每个 tag 都有一个可见的 Release。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
