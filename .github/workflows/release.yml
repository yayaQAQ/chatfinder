name: Release

# 打一个 v* 的 tag（如 v1.0.18）就会触发全平台构建并发布 Release。
# 也可以在 GitHub 网页手动触发（Actions -> Release -> Run workflow），
# 手动触发时必须填要发布的 tag——否则构建出的产物会挂到分支名下。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v1.0.18）"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：一台机器出 Intel + Apple Silicon 通用包
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          # Linux：.deb / .AppImage / .rpm
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          # Windows：.msi / .exe(NSIS)
          - platform: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          # 手动触发时 checkout 的是分支，要显式切到指定 tag，
          # 否则打包出来的是分支最新代码而不是这个 tag 的代码。
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: npm ci

      - name: Build & release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "ChatFinder ${{ inputs.tag || github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          # 草稿版本不会出现在仓库首页的 Releases 里，也不能被下载——
          # 直接发布，让每个 tag 都有一个可见的 Release。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
